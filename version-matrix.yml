# version-matrix.yml
#
# AIBot 全版本覆盖矩阵。
#
# 说明：Minecraft 的 API 在版本间反复大改，无法用一份源码编译所有版本。
# 因此按「API 断代」划分，每个断代一个源码目录，用 fabric.mod.json 的
# depends.minecraft 声明它覆盖的版本区间。
#
# 命名规则：fab-<断代代表版本>，代表版本选取该断代内 API 最完整的一个。
#
# 字段：
#   id          目录名
#   minecraft   编译用的 MC 版本（该断代的代表版本）
#   covers      该 jar 实际兼容的 MC 版本区间（写进 fabric.mod.json）
#   java        编译目标 Java 版本
#   loader      Fabric Loader 版本
#   fabricApi   编译用的 fabric-api 版本
#   loom        Loom 版本
#   note        该断代的关键 API 特征（写代码时要对齐的点）
#   status      ready | pending | unsupported

generations:

  # ============ 1.14 ~ 1.14.4 ============
  - id: fab-1.14.4
    minecraft: "1.14.4"
    covers: ">=1.14 <1.15"
    java: 8
    loader: "0.14.24"
    fabricApi: "0.28.5+1.14"
    loom: "0.2.7"
    gradle: "6.9.4"
    note: >
      Yarn 命名时代。Entity/PlayerEntity/ServerPlayerEntity 皆带 Entity 后缀。
      无 Registry 静态访问，需用 Registry.BLOCK.get(Identifier)。
    status: pending

  # ============ 1.15 ~ 1.15.2 ============
  - id: fab-1.15.2
    minecraft: "1.15.2"
    covers: ">=1.15 <1.16"
    java: 8
    loader: "0.14.24"
    fabricApi: "0.28.5+1.15"
    loom: "0.2.7"
    gradle: "6.9.4"
    note: "与 1.14 断代基本一致，主要差异在方块/实体接口微调。"
    status: pending

  # ============ 1.16 ~ 1.16.5 ============
  - id: fab-1.16.5
    minecraft: "1.16.5"
    covers: ">=1.16 <1.16.5"
    java: 8
    loader: "0.14.24"
    fabricApi: "0.42.0+1.16"
    loom: "0.10.6"
    gradle: "7.4.2"
    note: >
      Registry 仍在重构。Identifier 构造仍为 new Identifier(ns, path)。
      命令注册仍是 CommandRegistrationCallback 早期版本。
    status: pending

