plugins {
    // 26.x 线用原生 loom（无 remap 后缀），依赖一律走 implementation。
    id 'net.fabricmc.fabric-loom' version "1.17.21"
    id 'maven-publish'
}

group = "com.example.aibot"
version = "0.6.0"

dependencies {
    minecraft "com.mojang:minecraft:26.1.2"
    // 26.1 起 Minecraft 不再混淆，Mojang 官方类名直接可用，因此没有映射声明。
    // （Mojang 从 26.x 起不再发布 client_mappings，写 loom.officialMojangMappings()
    //  会导致 "Failed to find official mojang mappings" 配置失败。）
    implementation "net.fabricmc:fabric-loader:0.19.3"
    implementation "net.fabricmc.fabric-api:fabric-api:0.155.3+26.1.2"
}

processResources {
    filesMatching('fabric.mod.json') {
        expand "version": version
    }
}

// 26.1.2 目标 Java 21（26.2 起才要求 25）。
java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
