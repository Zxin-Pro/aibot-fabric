# ============================================================
# 26.1.2 线：Java 25 编译目标（该版本 Minecraft 类文件已是 v69 = Java 25）。
# Loom 1.17.21 要求启动 Gradle 的 JVM 是 21+。
#
# 注意：26.x 起 Minecraft 不再混淆，Loom 默认使用官方类名，
# build.gradle 里不写 mappings（写了反而会因 Mojang 不再发布
# client_mappings 而配置失败）。
# ============================================================
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# configuration-cache=false 是 loom 已知 issue #1349 的官方示例做法，勿改。
org.gradle.configuration-cache=false

minecraft_version=26.1.2
loader_version=0.19.3
loom_version=1.17.21
fabric_api_version=0.155.3+26.1.2

version=0.6.0
group=com.example.aibot
