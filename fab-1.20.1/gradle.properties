# ============================================================
# 1.20.1 线：Java 17 编译目标。
#
# 两个关键点（踩坑记录）：
# 1) Loom 1.17.x 自身要求运行 Gradle 的 JVM 是 21+，
#    所以即使目标是 Java 17，也必须用 JDK 21 启动 gradlew。
# 2) toolchain 需要能找到本机 JDK 17。Gradle 只自动探测当前 JVM 所在 JDK，
#    因此用 org.gradle.java.installations.paths（Gradle 属性，注意不要写成 -D）
#    显式登记；否则 foojay 会去 github.com 下载（本机网络不可达而失败）。
# ============================================================
org.gradle.java.installations.paths=C:\\Users\\zjh19\\DSH\\tools\\jdk-17.0.20.1+1,C:\\Users\\zjh19\\DSH\\tools\\jdk-21.0.12.1+1,C:\\Users\\zjh19\\DSH\\tools\\jdk-25.0.4.1+1

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# configuration-cache=false 是 loom 已知 issue #1349 的官方示例做法，勿改。
org.gradle.configuration-cache=false

minecraft_version=1.20.1
loader_version=0.19.3
loom_version=1.17.19
fabric_api_version=0.92.11+1.20.1

version=0.7.0
group=com.example.aibot
